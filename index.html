<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NOW - آخرین شهر</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#030611;color:#eaf8ff;font-family:Tahoma,Arial}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}#brand{position:absolute;top:12px;left:12px;background:#061125dd;border:1px solid #31dfff;padding:10px;border-radius:10px;color:#50eaff;font-weight:bold;letter-spacing:3px}#hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#061125dd;padding:10px;border-radius:10px;font-size:12px;white-space:nowrap}#start{position:fixed;inset:0;background:#030611ed;display:grid;place-items:center;z-index:4;text-align:center}#card{background:#0a1630;border:1px solid #31dfff;border-radius:20px;padding:25px;max-width:360px}h1{color:#50eaff;font-size:42px;letter-spacing:8px}button{padding:13px 22px;background:#087fbd;color:white;border:1px solid #50eaff;border-radius:12px;font-size:16px}#controls{position:fixed;bottom:20px;left:18px;display:none;z-index:3}#controls button{margin:4px;opacity:.8}body.touch #controls{display:block}</style><div id="brand">NOW<br><small>LAST CITY · 3D</small></div><div id="ui"><div id="hint">WASD حرکت · Shift دویدن · Space پرش · ماوس چرخش دوربین</div></div><div id="controls"><button id="left">◀</button><button id="forward">▲</button><button id="back">▼</button><button id="right">▶</button><button id="jump">پرش</button></div><div id="start"><div id="card"><h1>NOW</h1><h3>آخرین شهر</h3><p>نمونهٔ اولیهٔ سه‌بعدی در مرورگر؛ شهر نئونی را بگرد!</p><p>در رایانه: WASD و ماوس<br>در گوشی: دکمه‌های حرکت و کشیدن صفحه برای چرخش</p><button id="play">ورود به شهر</button></div></div><script type="module">import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";document.body.classList.toggle("touch",matchMedia("(pointer:coarse)").matches);const scene=new THREE.Scene();scene.background=new THREE.Color(0x030611);scene.fog=new THREE.FogExp2(0x030611,.008);const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0x8bbaff,0x15101e,2));const light=new THREE.DirectionalLight(0x9bbaff,1.2);light.position.set(-20,50,10);scene.add(light);const mat=(c,e=0)=>new THREE.MeshStandardMaterial({color:c,emissive:e,emissiveIntensity:1.3});let floor=new THREE.Mesh(new THREE.PlaneGeometry(250,250),mat(0x101726));floor.rotation.x=-Math.PI/2;floor.position.y=-.1;scene.add(floor);scene.add(new THREE.GridHelper(250,80,0x153a55,0x102034));let seed=42;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}const colors=[mat(0x172238),mat(0x21182f),mat(0x102a35)];for(let x=-5;x<=5;x++)for(let z=-5;z<=5;z++){if(Math.abs(x)<2&&Math.abs(z)<2||rand()<.12)continue;let w=5+rand()*5,d=5+rand()*5,h=5+rand()*22,bx=x*19,bz=z*19;let b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),colors[Math.floor(rand()*3)]);b.position.set(bx,h/2,bz);scene.add(b);let wm=mat(rand()>.5?0x23d9ff:0xe52fcb,rand()>.5?0x23d9ff:0xe52fcb);for(let y=2;y<h-1;y+=2.8){let win=new THREE.Mesh(new THREE.BoxGeometry(.7,.8,.06),wm);win.position.set(bx,b.position.y-h/2+y,bz+d/2+.04);scene.add(win)}}const player=new THREE.Group();scene.add(player);let body=new THREE.Mesh(new THREE.CapsuleGeometry(.45,1,4,8),mat(0x111b2b,0x073c55));body.position.y=1;player.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.28,12,8),mat(0x35435b));head.position.y=1.85;player.add(head);let visor=new THREE.Mesh(new THREE.BoxGeometry(.36,.09,.06),mat(0x35eaff,0x35eaff));visor.position.set(0,1.9,-.25);player.add(visor);player.position.set(0,0,4);let yaw=0,pitch=-.1,vy=0,grounded=true,keys={},touchMove={x:0,z:0},started=false;function cam(){camera.position.set(player.position.x+Math.sin(yaw)*7,player.position.y+3,player.position.z+Math.cos(yaw)*7);camera.lookAt(player.position.x,player.position.y+1.2,player.position.z)}cam();addEventListener("keydown",e=>keys[e.code]=true);addEventListener("keyup",e=>keys[e.code]=false);let drag=null;renderer.domElement.addEventListener("pointerdown",e=>{if(e.clientX>innerWidth*.35)drag={x:e.clientX,y:e.clientY};});addEventListener("pointerup",()=>drag=null);addEventListener("pointermove",e=>{if(drag){yaw-=(e.clientX-drag.x)*.005;pitch=Math.max(-.4,Math.min(.4,pitch+(e.clientY-drag.y)*.002));drag={x:e.clientX,y:e.clientY}}});for(const [id,code] of [["left","KeyA"],["right","KeyD"],["forward","KeyW"],["back","KeyS"],["jump","Space"]]){let el=document.getElementById(id);el.addEventListener("pointerdown",()=>keys[code]=true);el.addEventListener("pointerup",()=>keys[code]=false);el.addEventListener("pointerleave",()=>keys[code]=false)}document.getElementById("play").onclick=()=>{document.getElementById("start").style.display="none";started=true};addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});let last=performance.now();function loop(now){requestAnimationFrame(loop);let dt=Math.min((now-last)/1000,.04);last=now;if(started){let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);let speed=keys.ShiftLeft?9:5;player.position.x+=(Math.sin(yaw)*f+Math.cos(yaw)*s)*speed*dt;player.position.z+=(Math.cos(yaw)*f-Math.sin(yaw)*s)*speed*dt;if(f||s)player.rotation.y=Math.atan2(Math.sin(yaw)*f+Math.cos(yaw)*s,Math.cos(yaw)*f-Math.sin(yaw)*s);if(keys.Space&&grounded){vy=7;grounded=false}vy-=18*dt;player.position.y+=vy*dt;if(player.position.y<0){player.position.y=0;vy=0;grounded=true}cam()}renderer.render(scene,camera)}requestAnimationFrame(loop);</script></html>
